<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Block Blast</title>
  <style>
    body {
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    canvas {
      background: #222;
      display: block;
      margin: 10px auto;
      border: 2px solid white;
      touch-action: none;
    }
    #slider {
      width: 90%;
      margin: 0 auto 20px;
      height: 40px;
      background: #666;
      border-radius: 20px;
      position: relative;
      touch-action: none;
    }
    #sliderHandle {
      width: 60px;
      height: 40px;
      background: #aaa;
      border-radius: 20px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    #status {
      font-size: 20px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <h1>Block Blast</h1>
  <div id="status">Level: 0 | Lines: 0 | Score: 0</div>
  <canvas id="game" width="300" height="500"></canvas>
  <div id="slider">
    <div id="sliderHandle"></div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const context = canvas.getContext('2d');
    context.scale(25, 25); // Larger scale

    const arena = createMatrix(12, 20);
    const player = { pos: { x: 0, y: 0 }, matrix: null };

    let dropInterval = 1000;
    let dropCounter = 0;
    let lastTime = 0;
    let level = 0;
    let linesCleared = 0;
    let score = 0;

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) matrix.push(new Array(w).fill(0));
      return matrix;
    }

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
              (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) matrix.forEach(row => row.reverse());
      else matrix.reverse();
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[Math.floor(Math.random() * pieces.length)]);
      player.pos.y = 0;
      player.pos.x = Math.floor(arena[0].length / 2) - Math.floor(player.matrix[0].length / 2);
      if (collide(arena, player)) {
        arena.forEach(row => row.fill(0));
        alert("Game Over!");
        level = 0;
        linesCleared = 0;
        score = 0;
        dropInterval = 1000;
      }
    }

    function playerMove(dir) {
      player.pos.x += dir;
      if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
      }
      dropCounter = 0;
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function arenaSweep() {
      let rowsCleared = 0;
      outer: for (let y = arena.length - 1; y >= 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) continue outer;
        }
        arena.splice(y, 1);
        arena.unshift(new Array(arena[0].length).fill(0));
        ++rowsCleared;
        ++linesCleared;
        if (linesCleared % 10 === 0) {
          level++;
          dropInterval = Math.max(100, 1000 - level * 100);
        }
        y++;
      }
      // Score based on number of lines at once
      const points = [0, 40, 100, 300, 1200];
      score += points[rowsCleared] * (level + 1);
    }

    function createPiece(type) {
      if (type === 'T') return [[0, 0, 0], [1, 1, 1], [0, 1, 0]];
      if (type === 'O') return [[2, 2], [2, 2]];
      if (type === 'L') return [[0, 3, 0], [0, 3, 0], [0, 3, 3]];
      if (type === 'J') return [[0, 4, 0], [0, 4, 0], [4, 4, 0]];
      if (type === 'I') return [[0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0], [0, 5, 0, 0]];
      if (type === 'S') return [[0, 6, 6], [6, 6, 0], [0, 0, 0]];
      if (type === 'Z') return [[7, 7, 0], [0, 7, 7], [0, 0, 0]];
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = 'hsl(' + value * 50 + ', 70%, 60%)';
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function draw() {
      context.fillStyle = '#000';
      context.fillRect(0, 0, canvas.width, canvas.height);
      drawMatrix(arena, { x: 0, y: 0 });
      drawMatrix(player.matrix, player.pos);
      document.getElementById('status').textContent =
        `Level: ${level} | Lines: ${linesCleared} | Score: ${score}`;
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval) playerDrop();
      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowLeft') playerMove(-1);
      else if (event.key === 'ArrowRight') playerMove(1);
      else if (event.key === 'ArrowDown') playerDrop();
      else if (event.key === 'q') playerRotate(-1);
      else if (event.key === 'w' || event.key === 'ArrowUp') playerRotate(1);
    });

    canvas.addEventListener('click', () => {
      playerRotate(1);
    });

    const slider = document.getElementById('slider');
    const handle = document.getElementById('sliderHandle');
    let isDragging = false;

    slider.addEventListener('touchstart', () => { isDragging = true; });
    slider.addEventListener('touchmove', e => {
      if (!isDragging) return;
      const touch = e.touches[0];
      const rect = slider.getBoundingClientRect();
      let percent = (touch.clientX - rect.left) / rect.width;
      percent = Math.max(0, Math.min(1, percent));
      handle.style.left = `${percent * 100}%`;
      const gridX = Math.floor(percent * (arena[0].length));
      const delta = gridX - player.pos.x;
      if (delta !== 0) playerMove(delta > 0 ? 1 : -1);
    });
    slider.addEventListener('touchend', () => { isDragging = false; });

    playerReset();
    update();
  </script>
</body>
</html>
